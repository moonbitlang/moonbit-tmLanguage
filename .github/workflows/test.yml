name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  grammar-compiler:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check grammar with GitHub Linguist
        run: |
          # Provide the minimal Linguist layout and require our expected scope.
          linguist_root=$(mktemp -d)
          trap 'rm -rf "$linguist_root"' EXIT
          mkdir -p "$linguist_root/lib/linguist" "$linguist_root/vendor/grammars/moonbit/grammars"
          printf 'ci\n' > "$linguist_root/lib/linguist/VERSION"
          printf 'vendor/grammars/moonbit:\n  - source.moonbit\n' > "$linguist_root/grammars.yml"
          docker run --rm \
            -v "$linguist_root:/src/linguist:ro" \
            -v "$GITHUB_WORKSPACE/grammars:/src/linguist/vendor/grammars/moonbit/grammars:ro" \
            -w /src/linguist \
            linguist/grammar-compiler:latest compile

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test
        run: npm test

      - name: Generate HTML preview
        run: npm run preview

      - name: Upload HTML preview
        uses: actions/upload-artifact@v4
        with:
          name: moonbit-grammar-preview
          path: preview.html
          if-no-files-found: error
